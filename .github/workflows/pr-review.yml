name: PR Review

# Claude reviews every pull request, as a formal GitHub review from claude[bot].
# This is the shared, reusable half: each repo calls it from a short workflow
# of its own (see README.md). The judgment lives in the ci-review-pr skill,
# plugins/pr-review/skills/ci-review-pr/, which the action installs from this
# repo's plugin marketplace on every run. Callers track main, so a change here
# reaches every repo on its next PR.
# Design: docs/working/pr-review.md.

on:
  workflow_call:
    inputs:
      release_branch:
        description: >-
          Base branch of this repo's release PRs (e.g. production). Round 1 of
          a PR into it gets a broader review. Empty when the repo has no
          release branch.
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A new push supersedes an in-progress round. Job level, because the docs
    # list concurrency only as a job keyword for called workflows; callers
    # must not set the same group, or each run cancels itself.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ASSOC: ${{ github.event.pull_request.author_association }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          # pipefail: every gh-api-into-jq pipe below otherwise reports jq's
          # exit code, so a transient API failure yields empty output and the
          # gate fails open into a paid review round on an approved PR.
          set -o pipefail

          # Trust gate. The reviewer runs with `gh` authenticated as
          # claude[bot] and Bash in its allowlist, and its whole job is to
          # read text the PR author controls — the diff, the PR body, commit
          # subjects. So only PRs from people with write access are reviewed.
          # In a private repo every PR author already has it, and this never
          # fires; it matters in public repos.
          #
          # The load-bearing test is the head repo, not author_association:
          # pushing a branch to the repo already requires write access, so a
          # same-repo PR is trusted by construction. author_association is not
          # dependable — PopoverAI/browser-automation#8 reported CONTRIBUTOR for
          # an org member whose comment on #6 reported MEMBER, and an
          # association-only gate skipped a maintainer's own PR. The
          # association check stays as a second chance for a collaborator
          # working from a fork (such a run gets no secrets anyway).
          #
          # Skips green rather than failing: a stranger's PR is a normal event,
          # not a broken build.
          trusted=false
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            trusted=true
          else
            case "$ASSOC" in
              OWNER|MEMBER|COLLABORATOR) trusted=true ;;
            esac
          fi
          if [ "$trusted" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: PR head '$HEAD_REPO' is a fork and author association '$ASSOC' is not OWNER/MEMBER/COLLABORATOR."
            exit 0
          fi
          # Approval ends the review: an approved PR costs nothing per push.
          # Re-opening review after approval is a deliberate act — a human
          # dismissing the review, or the pusher putting [re-review] in a
          # commit subject — never a plain push.
          # --paginate --slurp: reviews span pages on a long-lived PR, and a
          # missed later page is a missed approval (an extra round per push).
          # Piped to jq because gh refuses --slurp together with --jq.
          reviews=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            | jq '(add // []) | map(select(.user.login == "claude[bot]"))')
          # Verdict-bearing reviews only. A COMMENTED review carries no
          # verdict: the reviewer posts a bodiless one as the carrier for its
          # inline comments, and it lands just after the APPROVED it
          # accompanies. Reading the literal last review then saw COMMENTED,
          # reopened a loop the approval had closed, and spent a paid round on
          # an approved PR — the fail-open this gate exists to prevent. Seen in
          # practice.
          verdicts=$(echo "$reviews" \
            | jq '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")]')
          last_state=$(echo "$verdicts" | jq -r 'last | .state // "NONE"')
          count=$(echo "$reviews" | jq 'length')

          rereview=false
          if [ "$last_state" = "APPROVED" ]; then
            # [re-review] in the subject line of any commit the approval
            # doesn't cover buys one fresh round; its verdict then governs as
            # usual. Subject only: a body may talk about the tag (a changelog,
            # a revert) without requesting a round. Scanned from the
            # approved review's commit_id rather than just the pushed head so
            # a tagged round cancelled by a fast follow-up push (concurrency)
            # doesn't drop the request. After a force-push the approved commit
            # may be gone from the list; every commit is then uncovered and
            # the whole list is scanned. The endpoint returns at most 250
            # commits no matter the pagination; at that cap a tag beyond the
            # returned list can't be ruled out, so the gate buys the round
            # rather than silently skipping.
            approved_sha=$(echo "$verdicts" | jq -r 'last | .commit_id')
            verdict=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" \
              | jq -r --arg sha "$approved_sha" '(add // [])
                  | (map(.sha) | index($sha)) as $i
                  | (if $i == null then . else .[($i + 1):] end) as $uncovered
                  | ($uncovered | map(select(.commit.message | split("\n")[0] | test("\\[re-review\\]"; "i"))) | length) as $tagged
                  | if $tagged > 0 then "tagged=\($tagged)"
                    elif length >= 250 then "capped"
                    else "untagged" end')
            if [ "$verdict" = "untagged" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: claude[bot] has approved this PR."
              exit 0
            fi
            rereview=true
            if [ "$verdict" = "capped" ]; then
              echo "Re-review: the commit list hit the API's 250 cap; a tag beyond it can't be ruled out."
            else
              echo "Re-review requested: ${verdict#tagged=} tagged commit(s) since approved ${approved_sha}."
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "prior=$count" >> "$GITHUB_OUTPUT"
          echo "rereview=$rereview" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: steps.decide.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The skill comes from this repo, not the caller's .claude/: the
          # marketplace is cloned from its default branch on every run.
          plugin_marketplaces: https://github.com/PopoverAI/claude-pr-review.git
          plugins: pr-review@claude-pr-review
          prompt: "/pr-review:ci-review-pr ${{ github.event.pull_request.number }} ${{ inputs.release_branch }}"
          # The run log is the only visibility into a review that goes wrong.
          show_full_output: true
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Agent,Skill,Bash,Read,Grep,Glob,TodoWrite"
        env:
          # Unconfirmed-but-cheap insurance: one smoke run returned while its
          # finder subagents were still in flight, posting nothing. This forces
          # the review pipeline to run in the foreground so the process waits.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

      # A green check must mean a review was submitted. The action exits 0
      # even when the agent posts nothing — e.g. the model is rejected, or the
      # agent returns before posting. Assert the outcome, not any one cause.
      - name: Assert a review was submitted
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PRIOR: ${{ steps.decide.outputs.prior }}
          REREVIEW: ${{ steps.decide.outputs.rereview }}
        run: |
          # pipefail, as in the decide step: without it a transient gh api
          # failure yields an empty count and this assertion exits green
          # while certifying a review that was never posted.
          set -o pipefail
          reviews=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" \
            | jq '(add // []) | map(select(.user.login == "claude[bot]"))')
          after=$(echo "$reviews" | jq 'length')
          # Verdict-bearing only, for the reason given in the decide step: a
          # trailing bodiless COMMENTED review would otherwise mask the
          # standing approval and fail this assertion over a silence the
          # agent was entitled to.
          last_state=$(echo "$reviews" \
            | jq -r '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")]
                     | last | .state // "NONE"')
          # The skill's legitimate silences: the PR closed mid-run, or an
          # approval landed between the gate and the agent's own backstop.
          # Not on a re-review round: there the standing APPROVED is the very
          # review being reopened, not a licence for silence.
          pr_state=$(gh pr view "$PR" --json state --jq .state)
          if [ "$pr_state" != "OPEN" ] || { [ "$last_state" = "APPROVED" ] && [ "$REREVIEW" != "true" ]; }; then
            echo 'Skipping: the review agent was entitled to post nothing.'
            exit 0
          fi
          if [ "$after" -le "$PRIOR" ]; then
            echo '::error::No claude[bot] review was submitted this run. Check the action log above. "Workflow validation failed" means this PR changes the calling workflow file; that is expected on the PR that adds or edits it, and reviews resume once it merges. "Unknown command: /pr-review:ci-review-pr" means the plugin failed to install.'
            exit 1
          fi
          echo "claude[bot] reviews: $PRIOR before, $after after."
